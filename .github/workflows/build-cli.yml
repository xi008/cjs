name: build-cli
on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/build-cli.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache HTTPS deps
        uses: actions/cache@v4
        with:
          path: cli/deps/out
          key: https-deps-${{ runner.os }}-v1-${{ hashFiles('cli/deps/build_https.sh') }}

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ~/android-ndk
          key: ndk-r25c-${{ runner.os }}

      - name: Install NDK and build deps
        run: |
          if [ ! -d "$HOME/android-ndk" ]; then
            curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
            unzip -q /tmp/ndk.zip -d "$HOME"
            mv "$HOME/android-ndk-r25c" "$HOME/android-ndk"
          fi
          export ANDROID_NDK_HOME="$HOME/android-ndk"
          bash cli/deps/build_https.sh

      - name: Host build + smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev
          bash cli/build.sh host
          echo "=== ysp token-rnd smoke ==="
          OUT=$(./dist/host/ysp_cli token-rnd test-guid-001 1730000000000)
          echo "$OUT"
          echo "$OUT" | grep -Eq '^[0-9a-fA-F]{16,}$' || echo "WARN: unexpected token-rnd format"
          echo "=== ysp sign smoke ==="
          SIG=$(./dist/host/ysp_cli sign test-guid-001 "$OUT" some-input)
          echo "$SIG"
          echo "$SIG" | grep -Eq '^[0-9a-fA-F]{8,}$' || echo "WARN: unexpected sign format"
          echo "=== h5e serve smoke ==="
          ./dist/host/h5e_cli serve --port 18099 &
          SRV=$!
          sleep 1
          curl -sf http://127.0.0.1:18099/healthz
          kill $SRV || true

      - name: Android build (arm64-v8a, armeabi-v7a)
        run: |
          export ANDROID_NDK_HOME="$HOME/android-ndk"
          bash cli/build.sh android

      - name: Bundle cacert
        run: |
          for d in dist/*/; do cp cli/cacert.pem "$d"; done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-bins
          path: dist/
          if-no-files-found: error